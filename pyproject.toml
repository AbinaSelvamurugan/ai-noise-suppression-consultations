[build-system]
requires = ["setuptools>=75,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consult-audio"
version = "0.1.0"
description = "Privacy-oriented audio enhancement with classical spectral gating and trainable PyTorch CRN"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
 "numpy==2.3.5", "scipy==1.17.0", "soundfile==0.13.1", "torch==2.10.0",
 "fastapi==0.128.2", "uvicorn[standard]==0.40.0", "python-multipart==0.0.22",
 "pydantic==2.13.5", "PyYAML==6.0.3", "matplotlib==3.10.8"
]
[project.optional-dependencies]
evaluation = ["pystoi==0.4.1"]
quality = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.14.13", "mypy==1.19.1"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["consult_audio*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
